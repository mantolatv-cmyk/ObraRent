services:
  postgres:
    image: postgres:16-alpine
    container_name: mantovani-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mantovani_rental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seeds/001_catalog.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantovani_rental"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
